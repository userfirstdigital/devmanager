[package]
name = "connect-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Audited DevManager Connect Noise and sealed-frame leaf for native and WASM clients"
license = "Apache-2.0"

# The native and browser builds must consume this package through the same
# source and the same pinned toolchain.  Build-ConnectCrypto.ps1 checks these
# values before it invokes Cargo or wasm-bindgen; it never installs either
# dependency.
[package.metadata.connect-crypto-wasm]
schema-version = 1
toolchain = "1.94.0"
target = "wasm32-unknown-unknown"
wasm-bindgen-cli = "0.2.114"
module-path = "./wasm/connect_crypto.js"
output-directory = "web/src/connect/wasm"
protocol-major = 1

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
base64 = "=0.22.1"
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
hmac = "=0.12.1"
rmp-serde = "=1.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
wasm-bindgen = { version = "=0.2.114", optional = true }
zeroize = { version = "=1.8.2", features = ["derive"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
snow = { version = "=0.10.0", default-features = false, features = [
    "ring-accelerated",
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

# Browser WASM uses Snow's pure-Rust resolver. This avoids ring's native build
# toolchain while preserving the exact ring-accelerated resolver on native.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom-02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
snow = { version = "=0.10.0", default-features = false, features = [
    "use-blake2",
    "use-chacha20poly1305",
    "use-curve25519",
    "use-getrandom",
] }
uuid = { version = "=1.24.0", features = ["serde", "v7", "js"] }
