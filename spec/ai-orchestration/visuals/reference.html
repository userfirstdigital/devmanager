ence-row{padding:10px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px;font-size:12px}.evidence-row .text-link{font-size:11px}.scope-switch{display:flex;gap:6px;margin:12px 0}.knowledge-card{border:1px solid var(--line);border-radius:7px;background:#18181e;padding:13px;margin:11px 0}.knowledge-card p{font-size:11px}.knowledge-card footer{display:flex;gap:14px;margin-top:10px}.knowledge-card button{font-size:11px}details{margin-top:12px;font-size:11px;color:var(--muted)}summary{cursor:pointer;color:#c6c3d5;padding:8px 0}details p{font-size:11px!important}.bar-chart{margin:16px 0}.bar-label{display:flex;justify-content:space-between;font-size:11px;margin:10px 0 5px}.bar-track{height:8px;border-radius:3px;background:#25252d}.bar-fill{height:8px;border-radius:3px;background:#8d899e}.bar-fill.after{background:#a0b9a8}.intake{max-width:680px;margin:48px auto 24px}.intake h1{margin:10px 0 12px}.intake-intro{font-size:13px;color:var(--muted);margin-bottom:26px;max-width:540px}.intake-field{border:1px solid #454351;border-radius:10px;background:#1c1c22;padding:14px}.intake-field textarea{width:100%;min-height:112px;resize:vertical;border:0;background:transparent;color:var(--text);font-size:16px;line-height:1.55;padding:3px}.intake-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.project-pill{display:flex;align-items:center;gap:7px;font-size:12px}.project-pill select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:5px 7px}.example-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.example-row button{font-size:11px;border:1px solid var(--line);color:var(--muted)}.rules-field{width:100%;height:72px;border:1px solid var(--line);border-radius:5px;background:#19191f;color:var(--text);padding:9px;font-size:12px}.intake-foot{margin-top:28px;display:flex;gap:12px;font-size:11px;color:var(--muted)}.intake-foot .check-mark{margin-top:2px}.overlay-backdrop{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);max-width:600px;padding:12px 18px;border:1px solid #575361;border-radius:8px;background:#28252f;color:#eee;font-size:12px;z-index:10;box-shadow:0 8px 30px #0006}.toast[hidden]{display:none}dialog{color:var(--text);background:#1a1a20;border:1px solid #55515f;border-radius:12px;padding:22px;width:min(600px,calc(100vw - 40px));box-shadow:0 25px 100px #0008}dialog::backdrop{background:#0009}dialog h2{margin-bottom:15px}dialog p{font-size:13px;color:var(--muted)}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#111115;padding:13px;border-radius:6px;color:#cecadb}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.diff-line{padding:7px 10px;margin:6px 0;font-size:12px;border-left:2px solid var(--green);background:#1c2820}.diff-line.old{border-color:#a27979;background:#2b2125;color:#d0b9be}

@media(max-width:1000px){.board{width:58px}.board-head{padding:12px 5px}.board-head h2,.board-search,.board-group-label,.board-item-title,.board-item-sub,.board-project,.board-footer,.board-head .new-label{display:none}.board-item{width:42px;height:40px;margin:6px 8px;padding:6px;border-left-width:2px;text-align:center}.rail-mark{display:block;font-size:12px}.board-head .row{justify-content:center}.board-head button{padding:4px 8px}.pane-title{padding:0 13px}.pane-tabs{padding:0 8px}.pane-tabs button{padding:6px 8px}.title-status{display:none}.reference-bar .reference-extra{display:none}.feed{padding:22px}.detail{width:min(366px,calc(100% - 26px))}}

<body>
<div class="reference-bar"><span><strong>DevManager · A10 design references</strong><span class="reference-extra"> — illustrative data; no host or provider actions</span></span><div class="row"><label for="scene">View</label><select id="scene" aria-label="Reference state"></select><a href="../UX-SPEC.md">UI spec</a></div></div>
<main class="product" id="product" aria-label="DevManager design target"></main>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><footer id="dialog-footer"></footer></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const scenes=[['start','01 · Start a goal'],['working','02 · Work in progress'],['plan','03 · Plan and artifacts'],['agents','04 · Agents and ownership'],['decision','05 · Needs you'],['recovery','06 · Recovery and pause'],['tests','07 · Repair 300 red tests'],['performance','08 · Performance outcome'],['knowledge','09 · Memory and Axe report'],['delivery','10 · Verified delivery']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='',extra='')=>`<button type="button" data-action="${action}" class="${cls}" ${extra}>${label}</button>`;
let scene=location.hash.slice(1)||'working',detail=null,answer='',runOverride='',scope='project',drafts={},messages={},returnFocus=null;
let goalDraft='Implement specs/customer-exports/ end to end.',ruleDraft='Keep production migrations as a manual delivery step.';
if(!scenes.some(x=>x[0]===scene))scene='working';
const goalId=()=>scene==='tests'?'tests':scene==='performance'?'speed':'exports';
const goalTitle=()=>scene==='start'?'New goal':scene==='tests'?'Fix 300 red tests':scene==='performance'?'Make the orders page faster':'Customer data exports';
const defaultDetail=s=>({plan:'plan',agents:'agents',tests:'checks',performance:'checks',knowledge:'knowledge',delivery:'checks'}[s]||null);
detail=defaultDetail(scene);
function setScene(next){if(!scenes.some(x=>x[0]===next))return;scene=next;detail=defaultDetail(scene);answer='';runOverride='';history.replaceState(null,'','#'+scene);render()}
function stateLabel(){if(runOverride)return runOverride;if(scene==='decision')return'Needs your decision';if(scene==='recovery')return'Waiting for provider';if(scene==='delivery')return'Verified';if(scene==='performance')return'Verifying improvement';if(scene==='tests')return'Fixing shared causes';if(scene==='start')return'Draft';return'Implementing'}
function board(){const expState=scene==='decision'?'Needs you':scene==='recovery'?'Waiting':scene==='delivery'||scene==='performance'?'Delivered':'Working';let data=[{id:'exports',title:'Customer data exports',project:'Command',sub:expState==='Needs you'?'Retention decision · 4m':expState==='Waiting'?'Provider reset at 14:32':expState==='Delivered'?'Verified · ready to deploy':'Building export flow',group:expState,mark:'E'},{id:'tests',title:'Fix 300 red tests',project:'Command',sub:'276 resolved · 24 remaining',group:'Working',mark:'T'},{id:'speed',title:'Make the orders page faster',project:'Command',sub:scene==='delivery'||scene==='performance'?'Checking 5 comparable samples':'Waiting for Command/api',group:scene==='delivery'||scene==='performance'?'Working':'Waiting',mark:'P'}];if(scene==='start')data=data.filter(x=>x.id!=='exports');let groups=['Needs you','Working','Waiting','Delivered'];return `<aside class="board" aria-label="Goals"><div class="board-head"><div class="row between"><h2>Board</h2>${button('+ <span class="new-label">New</span>','new-menu','secondary small','aria-label="New goal or manual task"')}</div></div><div class="board-search">Find a task <span style="float:right">/</span></div>${groups.map(g=>{const xs=data.filter(x=>x.group===g);return xs.length?`<div class="board-group-label"><span>${g}</span><span>${xs.length}</span></div>${xs.map(x=>`<button class="board-item ${x.id==='tests'?'purple':''} ${scene!=='start'&&goalId()===x.id?'selected':''}" data-action="goal:${x.id}" title="${esc(x.title)} — ${esc(x.sub)}" aria-label="Open ${esc(x.title)}"><span class="rail-mark">${x.mark}</span><span class="board-item-title">${x.title}</span><span class="board-item-sub"><i class="dot ${g==='Needs you'?'amber':g==='Delivered'?'green':''}"></i>${x.sub}</span><span class="board-project">${x.project}</span></button>`).join('')}`:''}).join('')}<div class="board-footer"><div class="row"><i class="dot green"></i> Local host connected</div><div style="margin-top:5px">${scene==='start'?'1 goal active · 1 waiting':'2 goals active · shared limits applied'}</div></div></aside>`}
function shell(){return `<header class="app-top"><div class="brand"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>DevManager <span class="muted" style="font-weight:400;margin-left:14px">All projects⌄</span></div><div class="top-right"><span class="extra">Ctrl+P &nbsp; Switch</span><span class="extra">Ctrl+Shift+Z &nbsp; Zoom</span>${button('⚙','inspect:Settings','icon','aria-label="Existing settings"')}</div></header><div class="workspace">${board()}<section class="pane" aria-label="Selected goal"><div class="pane-title"><div class="row grow"><span class="quiet">◈</span><h2>${goalTitle()}</h2><span class="title-status"><i class="dot ${scene==='decision'?'amber':scene==='delivery'?'green':''}"></i>${stateLabel()}</span></div><div class="row">${scene==='start'?'':scene==='delivery'?button('View changes','inspect:Changes','secondary small'):button(runOverride==='Paused'?'Resume':'Pause',runOverride==='Paused'?'resume':'pause','secondary small',runOverride==='Stopping'?'disabled':'')}${button('⋯','goal-menu','icon','aria-label="Goal actions"')}</div></div><nav class="pane-tabs" aria-label="Existing pane views">${['Conversation','Terminal','Files','Changes','Browser'].map((x,i)=>button(x,i?'inspect:'+x:'conversation',`${i?'':'active'} ${i>2?'optional':''}`)).join('')}<span class="grow"></span>${button('Details','detail:plan','small','aria-label="Open goal details"')}</nav><div class="content-split"><section class="conversation" aria-label="Lead conversation"><div class="feed"><div class="reading">${scene==='start'?intake():feed()}</div></div>${scene==='start'?'':composer()}</section>${detail?`<button class="overlay-backdrop" data-action="close-detail" aria-label="Close goal details overlay"></button>${detailsView()}`:''}</div></section></div>`}
function summary(){let label=scene==='tests'?'REPAIR CAMPAIGN':scene==='performance'?'PERFORMANCE':scene==='delivery'?'DELIVERY':'GOAL';let title=scene==='tests'?'Restore the requested suite without hiding failures':scene==='performance'?'Orders visible within the agreed 300 ms budget':'Deliver customer data exports end to end';let sub=scene==='tests'?'276 verified resolved · 24 remaining · 2 newly exposed':scene==='performance'?'Cold production load · 5 navigations · regression checks in progress':scene==='delivery'?'Built, independently audited, tested, and committed':scene==='decision'?'One product decision pending · independent work continues':scene==='recovery'?'Work preserved · one branch waiting · another can continue':'Implementation in progress · API + staff web';return `<section class="summary"><div class="row between"><span class="label">${label} <span class="quiet">/ Command</span></span><span class="tag ${scene==='decision'?'amber':scene==='delivery'?'green':''}">${stateLabel()}</span></div><h2>${title}</h2><div class="summary-line">${sub}</div>${scene==='delivery'?'':`<div class="stage-track" aria-hidden="true"><span class="done"></span><span class="${scene==='tests'?'done':'current'}"></span><span class="${scene==='tests'||scene==='performance'?'current':''}"></span><span></span></div><div class="stage-caption"><span>Plan</span><span>Build</span><span>Verify & repair</span><span>Deliver</span></div>`}<div class="summary-links">${button('Plan','detail:plan')}${button('Agents · 2','detail:agents')}${button(scene==='tests'?'Checks · 3 causes':'Checks','detail:checks')}${button('Knowledge','detail:knowledge')}</div></section>`}
function lead(body,time='Just now'){return `<article class="message"><div class="message-head"><span class="avatar">L</span><b>Lead</b><span class="muted">Claude Code</span><span class="quiet">· ${time}</span></div><div class="message-body">${body}</div></article>`}
function feed(){let content='';if(scene==='decision'){content=lead('<p>The export request and download flow are built. One retention decision affects cleanup; I can finish the operator checks while you decide.</p>')+`<section class="decision" aria-label="Pending product decision"><span class="label amber">Needs your decision</span><h2>How long should generated exports remain available?</h2><p class="small-copy muted">This controls when a completed download expires. The current agreement does not settle retention.</p><button class="choice recommended ${answer==='30'?'selected':''}" data-action="answer:30" aria-pressed="${answer==='30'}"><b>30 days <span class="tag amber" style="display:inline;margin-left:8px">Recommended</span></b><span>More time for customers to download; retains files longer.</span></button><button class="choice ${answer==='7'?'selected':''}" data-action="answer:7" aria-pressed="${answer==='7'}"><b>7 days</b><span>Shorter retention; customers have less time to return.</span></button><div class="decision-footer"><small>You can also reply in the conversation.</small>${button('Send answer','send-answer','primary small',answer?'':'disabled')}</div></section>`}
else if(scene==='recovery'){content=lead('<p>The implementation is preserved. Claude reported a temporary provider limit; I have not started a duplicate lead.</p>')+`<section class="notice"><div class="row between"><span class="label amber">Known wait</span><span class="tag">No input needed</span></div><h3>Lead resumes at the reported reset time</h3><p>Next eligible check: 14:32. The existing Codex worker can finish its owned build. Attempts and remaining budget stay with this goal.</p>${button('Inspect owned work','detail:agents','text-link')}</section>`+lead('<p>The next step is independent verification of the integrated changes. If recovery fails, I will show the specific blocker here.</p>','1m ago')}
else if(scene==='delivery'){content=`<section class="delivery"><span class="label green">Verified outcome</span><h2>Customer exports are ready to deploy</h2><p>Customers can request and download an export. Operators can see its state and diagnose failures.</p><div class="delivery-grid">${['API + staff web implemented','Independent audit closed','End-to-end journeys passed','Native/UI evidence reviewed'].map(x=>`<div class="check-line"><span class="check-mark">✓</span>${x}</div>`).join('')}</div><div class="delivery-actions">${button('Review evidence','detail:checks','secondary small')}${button('View changes','inspect:Changes','secondary small')}${button('Axe report','detail:knowledge','small')}</div></section><div class="info-note"><b>Delivery step remaining</b><br>Production migration and deployment remain manual, as requested. The run-sheet lists the exact participating revisions and commands.</div>`+lead('<p>I consolidated the export retry guidance into its existing project section. The source diff and supporting audit findings are in the Axe report.</p>','At close-out')}
else if(scene==='tests'){content=lead('<p>I have verified 276 of the original 300 failing cases as resolved. The remaining 24 cluster around three causes. Two newly exposed failures are tracked separately.</p><p>The next batch repairs the shared authorization fixture. I will rerun those cases and reconcile the complete requested suite before calling the campaign done.</p>')+activity([['Codex','Repairing the shared fixture','Working'],['Claude','Maintaining inventory and evidence','Lead'],['Fresh verifier','Starts after this repair settles','Queued']])}
else if(scene==='performance'){content=lead('<p>The comparable cold-load samples improved from a 1.24 s median to 248 ms. The recorded target is below 300 ms.</p><p>I am checking the affected user journey and the remaining regression paths. The goal stays unverified until those checks finish.</p>')+`<div class="info-note">Measurement conditions: production assets, empty HTTP/module caches, valid authentication, fixed network/CPU conditions, five navigations. These values are illustrative design data.</div>`}
else{content=`<div class="user-message">Implement specs/customer-exports/ end to end. Keep production migrations manual.</div>`+lead('<p>The build documents are ready. I am implementing the export request and download flow across the API and staff web, with operator visibility in the same slices.</p><p>Next, a fresh session will audit the integrated behavior and run the end-to-end journeys. I will handle fixes and re-verification without another handoff.</p>')+activity([['Codex','Building the export flow · API + web','Working'],['Lead','Reconciling acceptance and dependencies','Active'],['Fresh audit','Waiting for implementation to settle','Queued']])}
return summary()+content+(messages[goalId()]||[]).map(m=>`<div class="user-message">${esc(m)}</div>`).join('')+(runOverride?`<div class="info-note" role="status"><b>${esc(runOverride)}</b> · This reference simulates the visible transition. Real settlement is verified through the native host.</div>`:'')}
function activity(rows){return `<div class="activity-box"><span class="label">Current work</span>${rows.map(r=>`<div class="activity-line"><i class="dot"></i><span class="grow"><b>${r[0]}</b> <span class="muted">${r[1]}</span></span><span class="tag">${r[2]}</span></div>`).join('')}</div>`}
function composer(){return `<div class="composer-wrap"><form class="composer" id="message-form"><textarea id="message-input" aria-label="Message the lead" placeholder="Ask about progress, add a rule, or steer this goal…">${esc(drafts[goalId()]||'')}</textarea><div class="composer-bottom"><span>Command · this goal only</span><div class="row">${button('＋','inspect:Attach context','icon','aria-label="Attach context"')}<button class="secondary" type="submit">Send ↗</button></div></div></form><div class="composer-note">Work continues while you inspect details. Messages stay with this goal.</div></div>`}
function intake(){return `<section class="intake"><span class="label">A goal for your lead</span><h1>What should the lead take care of?</h1><p class="intake-intro">Hand over a finished spec, a project outcome, or a problem. The lead handles planning, implementation, audits, tests, and the fixes needed to finish.</p><form id="goal-form"><div class="intake-field"><textarea id="goal-input" aria-label="Goal or spec directory" placeholder="Describe the outcome or paste a spec directory…">${esc(goalDraft)}</textarea><div class="intake-actions"><label class="project-pill"><i class="dot" style="background:var(--teal)"></i>Project <select aria-label="Project"><option>Command</option><option>DevManager</option></select></label><button type="submit" class="primary">Start goal ↗</button></div></div><div class="example-row">${button('Do this spec','example:spec')}${button('Fix failing tests','example:tests')}${button('Speed up a page','example:speed')}</div><details><summary>Project rules apply · add rules for this goal</summary><textarea class="rules-field" id="rules-input" aria-label="Additional goal rules">${esc(ruleDraft)}</textarea><p>Additional instructions apply to this goal; they do not silently rewrite project policy.</p></details></form><div class="intake-foot"><span class="check-mark">✓</span><span>Existing provider setup and project guidance are used.<br>Only consequential decisions that the lead cannot settle come back to you.</span></div></section>`}
function detailsView(){return `<aside class="detail" aria-label="Goal details"><div class="detail-head"><div><span class="label">This goal</span><h2>Goal details</h2></div>${button('×','close-detail','icon','aria-label="Close goal details"')}</div><nav class="detail-tabs" aria-label="Goal detail sections">${['plan','agents','checks','knowledge'].map(x=>button(x[0].toUpperCase()+x.slice(1),'detail:'+x,x===detail?'active':'',`aria-current="${x===detail?'page':'false'}"`)).join('')}</nav><div class="detail-body">${({plan:planView,agents:agentsView,checks:checksView,knowledge:knowledgeView}[detail]||planView)()}</div></aside>`}
function planView(){let steps=[['✓','Build documents ready','Overview, acceptance, and test plan','done'],['2','Request and download an export','API + web · implementation active','current'],['3','Retention and recovery','API + web · depends on agreed retention',''],['4','Independent audit and E2E','Current behavior, evidence, and fixes',''],['5','Verified delivery','All repos, checks, and remaining actions','']];return `<section class="detail-section"><span class="label">Outcome and coverage</span><h2>Customer data exports</h2><p>One complete flow, with user and operator visibility in each slice.</p><div class="detail-list">${steps.map(x=>`<div class="step ${x[3]}"><span class="step-number">${x[0]}</span><div class="grow"><h3>${x[1]}</h3><p>${x[2]}</p>${button('Acceptance & artifacts','inspect:Milestone acceptance','text-link')}</div></div>`).join('')}</div></section><section><span class="label">Source documents</span>${['SPEC.md','build/00-overview.md','build/TRACKING.md','build/TEST-PLAN.md'].map(x=>`<div class="evidence-row"><span class="mono">${x}</span>${button('Open','inspect:'+x,'text-link')}</div>`).join('')}<p class="small-copy">Technical plan changes retain their reason and invalidate affected checks.</p></section>`}
function agentsView(){return `<section class="detail-section"><span class="label">2 current runtimes</span><h2>Owned work</h2><p>Profiles are selected under the project’s rules. The lead owns delegation.</p></section><article class="agent"><div class="row between"><h3>Lead</h3><span class="tag">${scene==='recovery'?'Waiting':'Active'}</span></div><p>Claude Code · steering this goal and its acceptance</p><footer><span>Current goal conversation</span>${button('Inspect','inspect:Lead assignment','text-link')}</footer></article><article class="agent"><div class="row between"><h3>Implementation</h3><span class="tag">Working</span></div><p>Codex · export flow across API + staff web</p><footer><span>Last verified activity · 12s ago</span>${button('Open worker','inspect:Worker conversation','text-link')}</footer></article><article class="agent"><div class="row between"><h3>Fresh verification</h3><span class="tag">Queued</span></div><p>Starts when this implementation settles and the required capacity is available.</p><footer><span>Independent context required</span></footer></article><details open><summary>Why these agents?</summary><p>Required repository/tool access and role capabilities are checked before ranking. A fallback must retain them.</p></details><details><summary>Provider, context & resource details</summary><p>Claude: ${scene==='recovery'?'reported reset at 14:32':'available at last observation'}. Exact provider session and owned workspace are inspected through the existing diagnostics.</p><p>Unreported token usage: unknown. Compact evidence links to its original source version.</p>${button('Retrieve original evidence','inspect:Original evidence','text-link')}</details>`}
function checksView(){if(scene==='tests')return `<span class="label">Requested suite</span><h2>300 original failing cases</h2><div class="metrics"><div class="metric"><strong class="green">276</strong><span>Verified resolved</span></div><div class="metric"><strong class="amber">24</strong><span>Remaining</span></div><div class="metric"><strong>2</strong><span>New failures</span></div></div><p>Case identities are retained. An incomplete run cannot reduce the inventory.</p><div class="rule"></div><span class="label">Remaining cause groups</span>${[['18 cases','Authorization fixture','Repair in progress'],['4 cases','Date-boundary handling','Ready after fixture repair'],['2 cases','Intermittent cancellation','Repeat verification required']].map(x=>`<button class="finding" data-action="inspect:Finding evidence"><span class="row between"><span class="amber">${x[0]}</span><span class="tag">Open</span></span><strong>${x[1]}</strong><small>${x[2]} →</small></button>`).join('')}<div class="rule"></div>${button('Open full inventory & run output','inspect:Full test inventory','text-link')}<p class="small-copy">Final closure requires the complete requested suite and reconciliation of newly exposed failures.</p>`;
if(scene==='performance')return `<span class="label">Orders page</span><h2>Cold-load comparison</h2><p>Target: requested data visible in less than 300 ms.</p><div class="bar-chart"><div class="bar-label"><span>Baseline median</span><strong>1.24 s</strong></div><div class="bar-track"><div class="bar-fill" style="width:89%"></div></div><div class="bar-label"><span>Current median</span><strong class="green">248 ms</strong></div><div class="bar-track"><div class="bar-fill after" style="width:18%"></div></div></div><div class="evidence-row"><span>Samples</span><span>5 before / 5 after</span></div><div class="evidence-row"><span>Current spread</span><span>231–276 ms</span></div><div class="evidence-row"><span>Production assets</span><span class="green">Matched</span></div><div class="evidence-row"><span>Cache / network / CPU</span><span class="green">Matched</span></div><div class="evidence-row"><span>Functional regression</span><span class="amber">In progress</span></div><div class="rule"></div>${button('Open samples & diagnosis','inspect:Performance evidence','text-link')}<p>The measured improvement alone does not complete the user journey or its regression checks.</p>`;
let done=scene==='delivery';return `<span class="label">Acceptance and findings</span><h2>${done?'All required checks verified':'Verification follows the build'}</h2><p>${done?'Evidence is bound to the delivered input versions.':'Built and verified remain distinct. A fresh reviewer closes findings.'}</p>${[['Build + existing gates',done?'Passed':'In progress'],['Independent audit',done?'Closed':'Queued'],['User + operator journeys',done?'Passed':'Not yet run'],['Visual / interaction evidence',done?'Reviewed':'Not yet run']].map(x=>`<div class="evidence-row"><span>${x[0]}</span><span class="${done?'green':'muted'}">${x[1]}</span></div>`).join('')}<div class="rule"></div><span class="label">Participating repositories</span><div class="evidence-row"><span>api</span><span class="mono">${done?'a71c923':'Changes in progress'}</span></div><div class="evidence-row"><span>web</span><span class="mono">${done?'b28d417':'Changes in progress'}</span></div><div class="rule"></div>${button('Open audit and current evidence','inspect:Audit evidence','text-link')}<div class="info-note">${done?'Production deployment remains a manual step. Read the run-sheet before delivery.':'Missing or stale evidence cannot be marked passed from this panel.'}</div>`}
function knowledgeView(){return `<span class="label">Canonical sources</span><h2>Knowledge & Axe report</h2><div class="scope-switch">${button('Project','scope:project',scope==='project'?'secondary small':'small')}${button('User-wide','scope:user',scope==='user'?'secondary small':'small')}</div><p>${scope==='project'?'Command’s rules and knowledge used for this goal.':'Only applicable general practices; Command data and permissions stay project-scoped.'}</p><article class="knowledge-card"><div class="row between"><h3>${scope==='project'?'Existing project guidance':'Working preferences'}</h3><span class="tag">Used</span></div><p>${scope==='project'?'Architecture, access boundaries, test commands, and known failed approaches.':'Finish authorized work, keep durable state, and raise consequential decisions.'}</p><footer>${button('View source','inspect:Canonical knowledge source','text-link')}${button('Correct this','correct-knowledge','text-link')}</footer></article><div class="rule"></div><span class="label">Sharpening the axe</span><article class="knowledge-card"><div class="row between"><h3>Consolidated retry guidance</h3><span class="tag ${scene==='delivery'?'green':''}">${scene==='delivery'?'Applied':'Under review'}</span></div><p>Related findings were merged into the existing project section. Successful counterexamples and the earlier rationale are retained.</p><footer>${button('Review diff & evidence','knowledge-diff','text-link')}</footer></article><article class="knowledge-card"><div class="row between"><h3>New general default</h3><span class="tag">Deferred</span></div><p>One incident is insufficient evidence for a user-wide rule. No general behavior was changed.</p></article>${button('Ask the lead to revise or retire an entry','correct-knowledge','text-link')}<p class="small-copy">A recorded correction must reach the owning source and future retrieval. An acknowledgement alone is insufficient.</p>`}
function render(){document.querySelector('#scene').innerHTML=scenes.map(([s,n])=>`<option value="${s}" ${scene===s?'selected':''}>${n}</option>`).join('');document.querySelector('#product').innerHTML=shell();document.title=`DevManager reference — ${scene}`}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3500)}
function dialog(title,body,actions=''){const d=document.querySelector('#dialog');returnFocus=document.activeElement;document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').innerHTML=body;document.querySelector('#dialog-footer').innerHTML=button('Close','close-dialog','secondary small')+actions;d.showModal()}
function closeDialog(){document.querySelector('#dialog').close();if(returnFocus?.isConnected)returnFocus.focus()}
document.addEventListener('change',e=>{if(e.target.id==='scene')setScene(e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='message-input')drafts[goalId()]=e.target.value;if(e.target.id==='goal-input')goalDraft=e.target.value;if(e.target.id==='rules-input')ruleDraft=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='goal-form'){if(!goalDraft.trim()){document.querySelector('#goal-input').focus();toast('Describe the goal before submitting.');return}setScene('working');toast('Simulated goal start. No provider or host was invoked.')}if(e.target.id==='message-form'){const text=drafts[goalId()]?.trim();if(!text)return;(messages[goalId()]||=[]).push(text);drafts[goalId()]='';render();document.querySelector('#message-input').focus();toast('Message added to this reference only.')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
if(a.startsWith('detail:')){detail=a.split(':')[1];render();document.querySelector('.detail-head button').focus()}
else if(a==='close-detail'){detail=null;render();document.querySelector('[aria-label="Open goal details"]').focus()}
else if(a==='conversation'){detail=null;render()}
else if(a==='new-menu')dialog('New work','<p>Start an autonomous goal or use the existing manual-task flow.</p>',button('New manual task','manual-task','secondary small')+button('New goal','new-goal','primary small'));
else if(a==='new-goal'){closeDialog();setScene('start');document.querySelector('#goal-input').focus()}
else if(a==='manual-task'){closeDialog();toast('The existing manual-task flow remains separate and unchanged.')}
else if(a.startsWith('goal:')){setScene(({exports:'working',tests:'tests',speed:'performance'})[a.split(':')[1]])}
else if(a.startsWith('answer:')){answer=a.split(':')[1];render();document.querySelector('[data-action="send-answer"]').focus()}
else if(a==='send-answer'){(messages.exports||=[]).push(`Keep generated exports for ${answer} days.`);setScene('working');toast('Decision submission simulated. Production must wait for its exact receipt.')}
else if(a==='pause'){runOverride='Pausing';render();toast('Pausing: current owned work must settle before Paused.');setTimeout(()=>{if(runOverride==='Pausing'){runOverride='Paused';render()}},650)}
else if(a==='resume'){runOverride='';render();toast('Resume is simulated against the preserved goal.')}
else if(a==='goal-menu')dialog('Goal actions','<p>Closing a pane is a view action. Stop goal settles only this goal’s owned work and preserves its edits and evidence.</p>',button('Stop goal…','confirm-stop','danger secondary small'));
else if(a==='confirm-stop'){closeDialog();dialog('Stop this goal?','<p>New work will stop being admitted. Already-started effects remain owned until cleanup is verified. Other goals continue.</p>',button('Stop goal','stop','danger secondary small'))}
else if(a==='stop'){closeDialog();runOverride='Stopping';render();toast('Stopping is simulated; this does not stop any real process.')}
else if(a==='close-dialog')closeDialog();
else if(a.startsWith('scope:')){scope=a.split(':')[1];render()}
else if(a==='correct-knowledge'){drafts[goalId()]='Please revise the project guidance shown in Knowledge. ';detail=null;render();document.querySelector('#message-input').focus()}
else if(a==='knowledge-diff')dialog('Axe report · proposed coherent revision','<p>Illustrative source diff with related findings, prior rationale, and independent review. The owning project file remains canonical.</p><div class="diff-line old">Separate incident notes repeat the same retry warning.</div><div class="diff-line">One maintained section explains retry ownership, the applicable conditions, and verified exceptions.</div><p>Evidence: related audit findings plus successful counterexamples. User-wide promotion: not requested.</p>');
else if(a.startsWith('example:')){goalDraft=({spec:'Implement specs/customer-exports/ end to end.',tests:'Fix the 300 red tests in the requested suite.',speed:'The orders page is too slow. Diagnose and fix it.'})[a.split(':')[1]];render();document.querySelector('#goal-input').focus()}
else if(a.startsWith('inspect:')){const title=a.slice(8);dialog(title,`<p>This design link opens the existing task-scoped viewer or the named evidence detail in the native implementation. It must retain a return path and exact goal/source identity.</p><pre>${esc(title==='Original evidence'?'Example original output:\nCompilation started\nOut of memory\nProcess killed\nResult: incomplete; never a successful build.':title==='Milestone acceptance'?'User journey: request an export → see current status → download the completed file.\nOperator journey: inspect the same export and its failure cause.\nRepos: API + staff web.\nEvidence: actual checks and current source/artifacts.':'Reference data only. The real implementation must read current, correlated host/source facts and expose missing or stale evidence honestly.')}</pre><p>No workspace file, provider, account, or application state is accessed by this prototype.</p>`)}
});
document.querySelector('#dialog').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('#dialog').open&&detail){detail=null;render();document.querySelector('[aria-label="Open goal details"]').focus()}});
window.reference={setScene,getState:()=>({scene,detail,goal:goalId(),drafts:{...drafts},runOverride}),scenes:scenes.map(x=>x[0])};
render();
</script>
</body>
</html>
