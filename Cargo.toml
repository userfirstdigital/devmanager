[package]
name = "devmanager"
version = "0.4.2"
edition = "2021"
description = "DevManager native GPUI client and durable local host"
license = "Apache-2.0"

[[bin]]
name = "devmanager"
path = "src/main.rs"

[[bin]]
name = "devmanager-host"
path = "src/bin/devmanager-host.rs"

[[bin]]
name = "devmanager-provider-probe-fixture"
path = "tests/fixtures/providers/probe_fixture.rs"
test = false
bench = false

[dependencies]
accesskit = "0.24.1"
alacritty_terminal = "0.25.1"
arboard = "3.6.1"
async-trait = "0.1.89"
cargo-packager-resource-resolver = "0.1.2"
cargo-packager-updater = "0.2.3"
dirs = "6.0.0"
gpui = "0.2.2"
gpui-component = "=0.5.1"
portable-pty = { version = "0.9.0", path = "third_party/portable-pty" }
regex = "1.12.3"
rfd = "0.17.2"
rmcp = { version = "=2.2.0", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
sysinfo = "0.38.4"
time = { version = "0.3.47", features = ["formatting", "local-offset"] }
toml = "1.0.7"
ureq = { version = "3", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
image = "0.25"
rmp = "0.8.15"
rmp-serde = "1.3.0"
rcgen = "0.13.2"
rustls = { version = "0.23.18", features = ["ring"] }
rustls-pemfile = "2.2.0"
sha2 = "0.10.9"
unicode-segmentation = "1.12.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "sync", "io-util", "macros", "time", "process"] }
tokio-tungstenite = { version = "=0.24.0", default-features = false, features = ["connect", "handshake"] }
unicode-normalization = "=0.1.24"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hmac = "0.12"
snow = { version = "=0.10.0", default-features = false, features = ["ring-accelerated", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
base64 = "0.22"
caseless = "=0.2.2"
futures-util = "0.3"
http-body-util = "0.1.3"
web-push-native = "=0.4.0"
getrandom = "0.3.4"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.34.0"
raw-window-handle = "0.6"
wry = { version = "=0.55.1", default-features = false, features = ["devtools", "protocol", "os-webview"] }
webview2-com = "=0.38.2"
windows-capture = "=1.5.0"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
winresource = "0.1"

[dev-dependencies]
rmcp = { version = "=2.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
static_assertions = "1.1.0"
tempfile = "3"

[package.metadata.packager]
product-name = "DevManager"
identifier = "com.userfirst.devmanager"
before-packaging-command = "cargo build --release --bin devmanager --bin devmanager-host"
authors = ["UserFirst"]
copyright = "Copyright (c) UserFirst"
description = "Native GPUI client plus durable host for Tasks, terminals, providers, workspace tools, and Connect."
icons = [
    "packaging/icons/devmanager-32.png",
    "packaging/icons/devmanager-128.png",
    "packaging/icons/devmanager-256.png",
    "packaging/icons/devmanager-512.png",
    "packaging/icons/devmanager.ico",
]
resources = ["assets", "third_party/ghostty"]
long-description = "DevManager ships one product with sibling binaries: the native GPUI desktop client (devmanager) and the durable local execution host (devmanager-host). They share semantic version, build, and protocol identity. Packages exclude worktrees, target/evidence trees, test fixtures, session.json, development profiles, Portal proprietary trees, zz-archive, and secrets. User prompt databases and organization content are never packaged."
binaries-dir = "target/release"
out-dir = "dist/packager"
publisher = "UserFirst"

[[package.metadata.packager.binaries]]
path = "devmanager"
main = true

[[package.metadata.packager.binaries]]
path = "devmanager-host"
main = false
